name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ---- Push a main -> entorno de PRUEBAS (hpserver) usa :test ----
      - name: Build and push backend image (test)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/fiumicello-backend:test
            ${{ secrets.DOCKERHUB_USERNAME }}/fiumicello-backend:test-${{ github.sha }}

      # ---- Tag de version (vX.Y.Z) -> PRODUCCION (Lenovo) usa :latest ----
      - name: Build and push backend image (latest / produccion)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/fiumicello-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/fiumicello-backend:${{ github.ref_name }}
